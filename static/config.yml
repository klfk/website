backend:
  name: github
  repo: klfk/website
  branch: main
  base_url: https://ivanm.xyz
  auth_endpoint: api/cms/auth

local_backend: true
publish_mode: simple

media_folder: static/uploads
public_folder: /uploads

collections:
  - name: portfolio
    label: Portfolio
    files:
      - name: bio
        label: Homepage Bio
        file: src/lib/content/bio.json
        format: json
        fields:
          - label: Source language
            name: sourceLanguage
            widget: hidden
            default: en
          - label: Target language
            name: targetLanguage
            widget: hidden
            default: de
          - label: Text
            name: strings
            widget: object
            summary: Homepage text
            fields:
              - label: Student line
                name: studentLine
                widget: object
                collapsed: true
                fields:
                  - label: English
                    name: en
                    widget: string
                  - label: German
                    name: de
                    widget: string
                  - label: Français
                    name: fr
                    widget: string
                  - label: 粵語
                    name: yue
                    widget: string
                  - label: हिन्दी
                    name: hi
                    widget: string
                  - label: Binary
                    name: binary
                    widget: string
                  - label: Source hash
                    name: sourceHash
                    widget: hidden
                    default: faa92177cf35
              - label: Bio
                name: bio
                widget: object
                fields:
                  - label: English
                    name: en
                    widget: text
                    buttons: [bold, italic, link]
                  - label: German
                    name: de
                    widget: text
                    buttons: [bold, italic, link]
                  - label: Français
                    name: fr
                    widget: text
                    buttons: [bold, italic, link]
                  - label: 粵語
                    name: yue
                    widget: text
                    buttons: [bold, italic, link]
                  - label: हिन्दी
                    name: hi
                    widget: text
                    buttons: [bold, italic, link]
                  - label: Binary
                    name: binary
                    widget: text
                    buttons: [bold, italic, link]
                  - label: Source hash
                    name: sourceHash
                    widget: hidden
                    default: 8e0907df7fb3
